// ─── FEEDBACK (localStorage) ─────────────────────────────────────────
const FB_KEY='bk_feedback_v1';
function loadFeedback(){try{return JSON.parse(localStorage.getItem(FB_KEY)||'{}')}catch{return{}}}
function saveFeedback(fb){localStorage.setItem(FB_KEY,JSON.stringify(fb))}
function setFeedback(codigo,val){
  const fb=loadFeedback();
  if(fb[codigo]===val){delete fb[codigo]}else{fb[codigo]=val}
  saveFeedback(fb);
  renderBoard();updateStats();
}
function getFeedback(codigo){return loadFeedback()[codigo]||null}

// ─── STATE ────────────────────────────────────────────────────────────
let activeCat='all',activeUrg='all',onlyLikes=false;
let openCodigo=null;

// ─── STATS ────────────────────────────────────────────────────────────
function updateStats(){
  const fb=loadFeedback();
  const likes=Object.values(fb).filter(v=>v==='like').length;
  const dislikes=Object.values(fb).filter(v=>v==='dislike').length;
  document.getElementById('badge-likes').textContent='❤️ '+likes;
  
  const allFotos=DAYS.flatMap(d=>d.fotos);
  document.getElementById('badge-total').textContent=allFotos.length+' referencias';
  
  // week stats
  const cats={};
  allFotos.forEach(f=>{if(fb[f.codigo]==='like'){cats[f.categoria]=(cats[f.categoria]||0)+1}});
  const topCats=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const ws=document.getElementById('week-stats');
  ws.innerHTML=`
    <div class="stat-item"><div class="stat-label">Total semana</div><div class="stat-val">${allFotos.length}</div><div class="stat-sub">referencias</div></div>
    <div class="stat-item"><div class="stat-label">Me gusta</div><div class="stat-val" style="color:var(--like)">${likes}</div><div class="stat-sub">marcadas</div></div>
    <div class="stat-item"><div class="stat-label">No gusta</div><div class="stat-val" style="color:#555">${dislikes}</div><div class="stat-sub">descartadas</div></div>
    ${topCats.map(([cat,n])=>`<div class="stat-item"><div class="stat-label">Top</div><div class="stat-val" style="font-size:13px;padding-top:4px">${cat}</div><div class="stat-sub">❤️ ${n} gustos</div></div>`).join('')}
  `;
}

// ─── RENDER ───────────────────────────────────────────────────────────
const chipCls=u=>u==='Alta'?'chip-alta':u==='Media'?'chip-media':'chip-baja';
const isToday=f=>f===new Date().toISOString().slice(0,10);

function renderBoard(){
  const fb=loadFeedback();
  const board=document.getElementById('board');
  board.innerHTML=DAYS.map((day,di)=>{
    let fotos=day.fotos.filter(f=>(activeCat==='all'||f.categoria===activeCat)&&(activeUrg==='all'||f.urgencia===activeUrg));
    if(onlyLikes)fotos=fotos.filter(f=>fb[f.codigo]==='like');
    if(!fotos.length)return '';
    const nuevo=isToday(day.fecha)&&di===0;
    const cards=fotos.map(f=>{
      const fbVal=fb[f.codigo];
      const likedCls=fbVal==='like'?'liked':fbVal==='dislike'?'disliked':'';
      return `<div class="photo-card ${likedCls}" id="card-${f.codigo}" onclick="openMod('${f.codigo}')">
        <span class="source-badge">${f.marca}</span>
        <img src="${f.imagen}" alt="${f.nombre}" loading="lazy" onerror="this.style.display='none'">
        <div class="fb-btns">
          <button class="fb-btn fb-like ${fbVal==='like'?'active':''}" onclick="event.stopPropagation();setFeedback('${f.codigo}','like')" title="Me gusta">❤️</button>
          <button class="fb-btn fb-dis ${fbVal==='dislike'?'active':''}" onclick="event.stopPropagation();setFeedback('${f.codigo}','dislike')" title="No gusta">👎</button>
        </div>
        <div class="photo-overlay">
          <span class="ov-chip ${chipCls(f.urgencia)}">${f.urgencia}</span>
          <div class="ov-name">${f.nombre}</div>
          <div class="ov-cat">${f.categoria} · ${f.codigo}</div>
          <div class="ov-actions">
            <a class="ov-btn dl" href="${f.imagen}" download="${f.codigo}.jpg" target="_blank" onclick="event.stopPropagation()">⬇ Descargar</a>
            <button class="ov-btn" onclick="event.stopPropagation();openMod('${f.codigo}')">Ver detalle</button>
          </div>
        </div>
        <div class="like-indicator"></div>
      </div>`;
    }).join('');
    return `<div class="date-section"><div class="date-label"><span>${day.label}</span>${nuevo?'<span class="new-pill">HOY</span>':''}</div><div class="brand-info">Marcas: ${day.marcas.join(' · ')} &nbsp;·&nbsp; ${day.resumen.substring(0,120)}...</div></div><div class="photo-grid">${cards}</div>`;
  }).join('');
  if(!board.innerHTML.trim())board.innerHTML='<div class="empty">Sin resultados para este filtro</div>';
  updateStats();
}

// ─── MODAL ───────────────────────────────────────────────────────────
function openMod(codigo){
  const f=DAYS.flatMap(d=>d.fotos).find(x=>x.codigo===codigo);
  if(!f)return;
  openCodigo=codigo;
  document.getElementById('m-img').src=f.imagen;
  document.getElementById('m-code').textContent=f.codigo;
  document.getElementById('m-name').textContent=f.nombre;
  document.getElementById('m-brand').textContent=f.marca+' · '+f.categoria;
  document.getElementById('m-cat').textContent=f.urgencia+' urgencia';
  document.getElementById('m-desc').textContent=f.descripcion;
  document.getElementById('m-src').textContent=f.fuente;
  document.getElementById('m-src').href=f.fuente;
  document.getElementById('m-src-btn').href=f.fuente;
  document.getElementById('m-dl').href=f.imagen;
  refreshModalFb();
  document.getElementById('modal-bg').classList.add('open');
}
function refreshModalFb(){
  if(!openCodigo)return;
  const fb=loadFeedback();
  const val=fb[openCodigo];
  document.getElementById('mfb-like').className='modal-fb-btn mfb-like'+(val==='like'?' active':'');
  document.getElementById('mfb-dis').className='modal-fb-btn mfb-dis'+(val==='dislike'?' active':'');
}
function modalFb(val){setFeedback(openCodigo,val);refreshModalFb()}
function closeMod(){document.getElementById('modal-bg').classList.remove('open');openCodigo=null}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMod()});

// ─── FILTER EVENTS ───────────────────────────────────────────────────
document.querySelectorAll('.fbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');activeCat=b.dataset.cat;renderBoard();
}));
document.querySelectorAll('.ubtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.ubtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');activeUrg=b.dataset.u;renderBoard();
}));
document.getElementById('like-filter-btn').addEventListener('click',function(){
  onlyLikes=!onlyLikes;
  this.classList.toggle('on',onlyLikes);
  renderBoard();
});

// ─── INIT ─────────────────────────────────────────────────────────────
renderBoard();
</script>
