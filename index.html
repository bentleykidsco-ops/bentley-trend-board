<!DOCTYPE html>

<style>
:root{--bk:#000;--wh:#fff;--gy:#888;--lt:#f5f5f3;--gd:#b8924a;--lk:#c0392b;--acc:#1a1a1a}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--wh);color:var(--bk);overflow-x:hidden}
.hdr{position:fixed;top:0;left:0;right:0;z-index:500;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid #f0f0f0}
.hbtn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:4px}
.hbtn span{display:block;width:22px;height:1px;background:var(--bk)}
.logo{font-family:'EB Garamond',serif;font-size:15px;letter-spacing:6px;text-transform:uppercase;color:var(--bk);text-decoration:none;position:absolute;left:50%;transform:translateX(-50%)}
.logo em{font-style:italic;color:var(--gd)}
.hright{display:flex;align-items:center;gap:12px}
.hright span{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gy)}
.hlk{color:var(--lk)!important}
.mode-bar{position:fixed;top:52px;left:0;right:0;z-index:490;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);border-bottom:1px solid #f0f0f0;display:flex;justify-content:center}

.mover{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.mover.open{opacity:1;pointer-events:all}
.smenu{position:fixed;top:0;left:-340px;bottom:0;width:320px;background:var(--wh);z-index:410;transition:left .35s cubic-bezier(.4,0,.2,1);overflow-y:auto}
.smenu.open{left:0}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #f0f0f0}
.mhd-logo{font-family:'EB Garamond',serif;font-size:13px;letter-spacing:5px;text-transform:uppercase}
.mclose{background:none;border:none;cursor:pointer;font-size:18px;color:var(--bk);line-height:1}
.msec{padding:24px 24px 0}
.mlbl{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--gy);margin-bottom:12px}
.mitems{display:flex;flex-direction:column}
.mitem{background:none;border:none;border-bottom:1px solid #f5f5f5;text-align:left;padding:12px 0;font-family:'EB Garamond',serif;font-size:19px;cursor:pointer;color:var(--bk);display:flex;align-items:center;justify-content:space-between;transition:color .2s}
.mitem:hover,.mitem.on{color:var(--gd)}
.mcnt{font-family:'Inter',sans-serif;font-size:9px;color:var(--gy)}
.mdiv{height:1px;background:#f0f0f0;margin:20px 24px 0}
.mchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mchip{background:none;border:1px solid #ddd;border-radius:20px;padding:5px 14px;font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--gy);transition:all .2s}
.mchip.on{background:var(--bk);border-color:var(--bk);color:var(--wh)}
.mtog{width:100%;padding:11px;border:1px solid #ddd;border-radius:4px;background:none;cursor:pointer;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gy);transition:all .2s;display:flex;align-items:center;gap:8px;margin-top:16px}
.mtog.on{background:var(--lk);border-color:var(--lk);color:var(--wh)}
.mstat{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5}
.mstat:last-child{border:none}
.mstn{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gy)}
.mstv{font-family:'EB Garamond',serif;font-size:18px}
main{padding-top:92px}
.t-day-hdr{padding:44px 20px 10px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.t-date{font-family:'EB Garamond',serif;font-size:26px}
.t-brands{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gy)}
.t-new{font-size:7px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--wh);background:var(--bk);padding:3px 9px;border-radius:2px;margin-left:auto}
.t-sum{padding:0 20px 22px;font-family:'EB Garamond',serif;font-size:15px;color:#999;line-height:1.7;max-width:540px;font-style:italic}
.t-duo{display:grid;grid-template-columns:1fr 1fr;gap:2px;height:100vh;min-height:480px;max-height:920px}
.t-solo{height:88vh;min-height:440px;max-height:820px}
#est-board{display:none}
.est-toolbar{padding:20px 20px 4px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #f0f0f0;margin-bottom:24px}
.etbtn{background:none;border:1px solid #e0e0e0;border-radius:20px;padding:6px 16px;font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:#aaa;transition:all .2s}
.etbtn.on{background:var(--bk);border-color:var(--bk);color:var(--wh)}
.est-grid{padding:0 20px 60px;columns:3 260px;column-gap:12px}

.ecard{break-inside:avoid;margin-bottom:12px;border:1px solid #f0f0f0;border-radius:4px;overflow:hidden;position:relative;cursor:pointer;transition:box-shadow .25s,transform .25s}

.ecard.liked{border-color:var(--lk);box-shadow:0 0 0 2px var(--lk)}
.ecard.disliked{opacity:.25;filter:grayscale(.7)}
.ecard img{width:100%;display:block;object-fit:cover;min-height:180px;max-height:400px;background:var(--lt)}
.efb{position:absolute;top:10px;right:10px;display:flex;gap:5px;opacity:0;transition:opacity .2s}
.ecard:hover .efb,.ecard.liked .efb,.ecard.disliked .efb{opacity:1}
.efp{width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.92);transition:transform .15s;backdrop-filter:blur(4px)}

.efp.la{background:var(--lk)}
.efp.da{background:#333}
.ecatbadge{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);font-size:7px;font-weight:700;letter-spacing:2px;padding:3px 9px;border-radius:20px;text-transform:uppercase;color:var(--bk)}
.ecbody{padding:14px 14px 16px;background:var(--wh)}
.eccode{font-size:7px;letter-spacing:2px;color:var(--gy);text-transform:uppercase;margin-bottom:3px}
.ecname{font-family:'EB Garamond',serif;font-size:18px;line-height:1.2;margin-bottom:4px}
.ectags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.ectag{font-size:7px;font-weight:600;letter-spacing:1px;padding:2px 8px;border:1px solid #e8e8e8;border-radius:20px;text-transform:uppercase;color:#999}
.ectag.alta{background:#000;color:#fff;border-color:#000}
.ecdesc{font-size:11px;color:#888;line-height:1.6}
.ecref{font-size:9px;color:#bbb;margin-top:6px}
.edc{position:relative;overflow:hidden;cursor:pointer;background:var(--lt)}
.edc img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.25,.46,.45,.94)}
.edc:hover img{transform:scale(1.03)}
.eclabel{position:absolute;bottom:0;left:0;right:0;padding:50px 18px 18px;background:linear-gradient(to top,rgba(0,0,0,.55),transparent);display:flex;flex-direction:column;gap:3px}
.eclabel-cat{font-size:7px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.6)}
.eclabel-name{font-family:'EB Garamond',serif;font-size:18px;color:var(--wh);line-height:1.2}
.eclabel-marca{font-size:7px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4)}
.eurg{position:absolute;top:12px;left:12px;font-size:7px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:3px 9px;border-radius:2px;background:rgba(255,255,255,.9);color:var(--bk)}
.eurg.alta{background:var(--bk);color:var(--wh)}
.edcfb{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:5px;opacity:0;transition:opacity .2s}
.edc:hover .edcfb,.edc.liked .edcfb,.edc.disliked .edcfb{opacity:1}
.edcpill{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.9);transition:transform .15s;backdrop-filter:blur(4px)}
.edcpill:active{transform:scale(.85)}
.edcpill.la{background:var(--lk)}
.edcpill.da{background:#333}
.edc.liked{outline:2px solid var(--lk)}
.edc.disliked{opacity:.3;filter:grayscale(.7)}
.edcov{position:absolute;inset:0;opacity:0;transition:opacity .3s;pointer-events:none}
.edc:hover .edcov{opacity:1;background:rgba(0,0,0,.12)}
.edcacts{position:absolute;bottom:72px;left:18px;display:flex;gap:7px;pointer-events:all}
.edcbtn{background:rgba(255,255,255,.92);border:none;border-radius:2px;padding:7px 14px;font-size:8px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;color:var(--bk);text-decoration:none;white-space:nowrap;backdrop-filter:blur(4px)}
.edcbtn.dl{background:var(--bk);color:var(--wh)}
.t-sep{height:1px;background:#ebebeb;margin:40px 0 0}
.modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:600;align-items:center;justify-content:center;padding:20px}
.modalbg.open{display:flex}
.modal{background:var(--wh);max-width:960px;width:100%;max-height:92vh;display:grid;grid-template-columns:1fr 380px;overflow:hidden;border-radius:2px}
@media(max-width:680px){.modal{grid-template-columns:1fr}}
.mimg{background:var(--lt);position:relative;overflow:hidden}
.mimg img{width:100%;height:100%;object-fit:cover;display:block;max-height:78vh}
.mbclose{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.9);border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;color:var(--bk);display:flex;align-items:center;justify-content:center}
.mbody{padding:28px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.mcode{font-size:7px;letter-spacing:3px;color:var(--gy);text-transform:uppercase}
.mname{font-family:'EB Garamond',serif;font-size:28px;line-height:1.15}
.mbrand{font-size:9px;letter-spacing:3px;color:var(--gd);text-transform:uppercase}
.mchps{display:flex;gap:7px;flex-wrap:wrap}
.mchp{font-size:8px;letter-spacing:2px;text-transform:uppercase;padding:4px 11px;border:1px solid #ddd;border-radius:2px;color:#666}
.mdesc{font-family:'EB Garamond',serif;font-size:16px;color:#555;line-height:1.8}
.msrc{font-size:10px;color:var(--gy)}
.msrc a{color:var(--bk)}
.mfbrow{display:flex;gap:8px}
.mfbbtn{flex:1;padding:10px;border:1px solid #ddd;border-radius:2px;cursor:pointer;font-size:11px;background:none;transition:all .2s}
.mfbbtn.lon{background:var(--lk);border-color:var(--lk);color:var(--wh)}
.mfbbtn.don{background:#333;border-color:#333;color:var(--wh)}
.macts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.mabtn{padding:11px 20px;font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;border:1px solid #ddd;border-radius:2px;cursor:pointer;text-decoration:none;color:var(--bk);background:none;transition:all .2s}
.mabtn:hover{border-color:var(--bk)}
.mabtn.pr{background:var(--bk);color:var(--wh);border-color:var(--bk)}
.nores{padding:80px;text-align:center;font-family:'EB Garamond',serif;font-size:20px;color:#ccc;font-style:italic}
footer{padding:32px 20px;border-top:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#bbb;margin-top:60px}
@media(max-width:768px){.t-duo{grid-template-columns:1fr;height:auto}.t-duo .edc{height:65vh}.t-solo{height:70vh}.t-date{font-size:20px}}
</style>
</head>

function renderEst(){const fb=lFB(EFB),items=filteredEst(),grid=document.getElementById('est-grid');document.getElementById('est-count-lbl').textContent=items.length+' propuestas';if(!items.length){grid.innerHTML='<div class="nores">Sin resultados.</div>';return;}grid.innerHTML=items.map(e=>{const v=fb[e.c],lc=v==='like'?'liked':v==='dislike'?'disliked':'';return '<div class="ecard '+lc+'" onclick="openMod(''+e.c+'','est')"><img src="'+e.img+'" alt="'+e.n+'" loading="lazy"><span class="ecatbadge">'+e.cat+'</span><div class="efb"><button class="efp '+(v==='like'?'la':'')+'" onclick="event.stopPropagation();setFB(''+e.c+'','like',''+EFB+'')">&#x2764;</button><button class="efp '+(v==='dislike'?'da':'')+'" onclick="event.stopPropagation();setFB(''+e.c+'','dislike',''+EFB+'')">&#x1F44E;</button></div><div class="ecbody"><div class="eccode">'+e.c+'</div><div class="ecname">'+e.n+'</div><div class="ectags"><span class="ectag '+(e.urg==='Alta'?'alta':'')+'">'+e.urg+'</span><span class="ectag">'+e.tec+'</span></div><div class="ecdesc">'+e.desc+'</div><div class="ecref">Ref: '+e.ref+'</div></div></div>';}).join('');}
function render(){if(mode==='tendencias')renderTend();else renderEst();}
function updateUI(){const fb=lFB(FB),efb=lFB(EFB),allF=DAYS.flatMap(d=>d.fotos);const tLk=Object.values(fb).filter(v=>v==='like').length,eLk=Object.values(efb).filter(v=>v==='like').length;const hdl=document.getElementById('hdr-likes');if(hdl)hdl.textContent=(tLk+eLk)>0?'❤ '+(tLk+eLk):'';const hdt=document.getElementById('hdr-total');if(hdt)hdt.textContent=mode==='tendencias'?allF.length+' ref':ESTAMPADOS.length+' disenos';const fd=document.getElementById('ftr-date');if(fd)fd.textContent=DAYS[0]?.label||'';['all','Chaquetas','Buzos','Camisetas','Conjuntos','Pantalones','Abrigos','Vestidos','Blusas'].forEach(c=>{const el=document.getElementById('cnt-'+c);if(el)el.textContent=c==='all'?allF.length:allF.filter(f=>f.categoria===c).length;});const cls={};allF.forEach(f=>{if(fb[f.codigo]==='like')cls[f.categoria]=(cls[f.categoria]||0)+1;});const topT=Object.entries(cls).sort((a,b)=>b[1]-a[1]);const ms=document.getElementById('menu-stats');if(ms)ms.innerHTML='<div class="mstat"><span class="mstn">Total</span><span class="mstv">'+allF.length+'</span></div><div class="mstat"><span class="mstn">Me gusta</span><span class="mstv" style="color:var(--lk)">'+tLk+'</span></div>'+topT.slice(0,3).map(([c,n])=>'<div class="mstat"><span class="mstn">'+c+'</span><span class="mstv" style="font-size:14px">❤ '+n+'</span></div>').join('');['all','Animales','Tipografia','Floral','Deportivo','Patron'].forEach(c=>{const el=document.getElementById('ecnt-'+c);if(el)el.textContent=c==='all'?ESTAMPADOS.length:ESTAMPADOS.filter(e=>e.cat===c).length;});const ecls={};ESTAMPADOS.forEach(e=>{if(efb[e.c]==='like')ecls[e.cat]=(ecls[e.cat]||0)+1;});const topE=Object.entries(ecls).sort((a,b)=>b[1]-a[1]);const eDis=Object.values(efb).filter(v=>v==='dislike').length;const ems=document.getElementById('emenu-stats');if(ems)ems.innerHTML='<div class="mstat"><span class="mstn">Total</span><span class="mstv">'+ESTAMPADOS.length+'</span></div><div class="mstat"><span class="mstn">Me gusta</span><span class="mstv" style="color:var(--lk)">'+eLk+'</span></div><div class="mstat"><span class="mstn">No gusta</span><span class="mstv" style="color:#aaa">'+eDis+'</span></div>'+topE.slice(0,3).map(([c,n])=>'<div class="mstat"><span class="mstn">'+c+'</span><span class="mstv" style="font-size:14px">❤ '+n+'</span></div>').join('');}
function openMod(id,type){openId=id;openType=type;let item;if(type==='tend'){item=DAYS.flatMap(d=>d.fotos).find(f=>f.codigo===id);if(!item)return;document.getElementById('m-img').src=item.imagen;document.getElementById('m-code').textContent=item.codigo;document.getElementById('m-name').textContent=item.nombre;document.getElementById('m-brand').textContent=item.marca;document.getElementById('m-chips').innerHTML='<span class="mchp">'+item.categoria+'</span><span class="mchp">'+item.urgencia+' urgencia</span>';document.getElementById('m-desc').textContent=item.descripcion;document.getElementById('m-src-p').style.display='block';document.getElementById('m-src').textContent=item.fuente.replace('https://','');document.getElementById('m-src').href=item.fuente;document.getElementById('m-srcbtn').href=item.fuente;document.getElementById('m-srcbtn').style.display='inline-block';document.getElementById('m-dl').href=item.imagen;}else{item=ESTAMPADOS.find(e=>e.c===id);if(!item)return;document.getElementById('m-img').src=item.img;document.getElementById('m-code').textContent=item.c;document.getElementById('m-name').textContent=item.n;document.getElementById('m-brand').textContent='Ref: '+item.ref;document.getElementById('m-chips').innerHTML='<span class="mchp">'+item.cat+'</span><span class="mchp">'+item.urg+' urgencia</span><span class="mchp">'+item.tec+'</span>';document.getElementById('m-desc').textContent=item.desc;document.getElementById('m-src-p').style.display='none';document.getElementById('m-srcbtn').style.display='none';document.getElementById('m-dl').href=item.img;}refreshModalFb();document.getElementById('modalbg').classList.add('open');}
function refreshModalFb(){const fb=lFB(openType==='tend'?FB:EFB),v=fb[openId];document.getElementById('mfb-like').className='mfbbtn'+(v==='like'?' lon':'');document.getElementById('mfb-dis').className='mfbbtn'+(v==='dislike'?' don':'');}
function modalFb(val){setFB(openId,val,openType==='tend'?FB:EFB);refreshModalFb();}
function closeMod(){document.getElementById('modalbg').classList.remove('open');openId=null;}
function openMenu(){document.getElementById('smenu').classList.add('open');document.getElementById('mover').classList.add('open');}
function closeMenu(){document.getElementById('smenu').classList.remove('open');document.getElementById('mover').classList.remove('open');}
document.getElementById('menu-btn').addEventListener('click',openMenu);
document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('tend-board').style.display=mode==='tendencias'?'':'none';document.getElementById('est-board').style.display=mode==='estampados'?'':'none';document.getElementById('tmenu-content').style.display=mode==='tendencias'?'':'none';document.getElementById('emenu-content').style.display=mode==='estampados'?'':'none';render();updateUI();}));
document.querySelectorAll('#cat-menu .mitem').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#cat-menu .mitem').forEach(x=>x.classList.remove('on'));b.classList.add('on');tCat=b.dataset.cat;render();closeMenu();}));
document.querySelectorAll('[data-u]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-u]').forEach(x=>x.classList.remove('on'));b.classList.add('on');tUrg=b.dataset.u;render();}));
document.getElementById('likes-toggle').addEventListener('click',function(){tLikes=!tLikes;this.classList.toggle('on',tLikes);render();});
document.querySelectorAll('#ecat-menu .mitem').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#ecat-menu .mitem').forEach(x=>x.classList.remove('on'));b.classList.add('on');eCat=b.dataset.ec;document.querySelectorAll('.etbtn').forEach(x=>x.classList.toggle('on',x.dataset.ec===eCat));render();closeMenu();}));
document.querySelectorAll('[data-eu]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-eu]').forEach(x=>x.classList.remove('on'));b.classList.add('on');eUrg=b.dataset.eu;render();}));
document.getElementById('est-likes-toggle').addEventListener('click',function(){eLikes=!eLikes;this.classList.toggle('on',eLikes);render();});
document.querySelectorAll('.etbtn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.etbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');eCat=b.dataset.ec;document.querySelectorAll('#ecat-menu .mitem').forEach(x=>x.classList.toggle('on',x.dataset.ec===eCat));render();}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMod();closeMenu();}});
render();updateUI();
</script>
</body>
</html>
