<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bentley Kids - Trend Board</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bk:#000;--wh:#fff;--gy:#888;--lt:#f5f5f3;--gd:#b8924a;--lk:#c0392b}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--wh);color:var(--bk);overflow-x:hidden}
.hdr{position:fixed;top:0;left:0;right:0;z-index:500;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid #f0f0f0}
.hbtn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:4px}
.hbtn span{display:block;width:22px;height:1px;background:var(--bk)}
.logo{font-family:'EB Garamond',serif;font-size:15px;letter-spacing:6px;text-transform:uppercase;color:var(--bk);text-decoration:none;position:absolute;left:50%;transform:translateX(-50%)}
.logo em{font-style:italic;color:var(--gd)}
.hright{display:flex;align-items:center;gap:12px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gy)}
#hdr-likes{color:var(--lk)}
.mode-bar{position:fixed;top:52px;left:0;right:0;z-index:490;background:rgba(255,255,255,.97);border-bottom:1px solid #f0f0f0;display:flex;justify-content:center}
.mbtn{background:none;border:none;border-bottom:2px solid transparent;padding:11px 28px;font-family:'EB Garamond',serif;font-size:14px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;color:#aaa;transition:all .25s}
.mbtn.on{color:var(--bk);border-bottom-color:var(--bk)}
.overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.open{opacity:1;pointer-events:all}
.smenu{position:fixed;top:0;left:-340px;bottom:0;width:320px;background:var(--wh);z-index:410;transition:left .35s cubic-bezier(.4,0,.2,1);overflow-y:auto}
.smenu.open{left:0}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #f0f0f0}
.mhd-logo{font-family:'EB Garamond',serif;font-size:13px;letter-spacing:5px;text-transform:uppercase}
.mclosebtn{background:none;border:none;cursor:pointer;font-size:20px;color:var(--bk)}
.msec{padding:24px 24px 0}
.mlbl{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--gy);margin-bottom:12px}
.mitems{display:flex;flex-direction:column}
.mitem{background:none;border:none;border-bottom:1px solid #f5f5f5;text-align:left;padding:12px 0;font-family:'EB Garamond',serif;font-size:19px;cursor:pointer;color:var(--bk);display:flex;align-items:center;justify-content:space-between;transition:color .2s}
.mitem:hover,.mitem.on{color:var(--gd)}
.mcnt{font-family:'Inter',sans-serif;font-size:9px;color:var(--gy)}
.mdiv{height:1px;background:#f0f0f0;margin:20px 24px 0}
.mchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mchip{background:none;border:1px solid #ddd;border-radius:20px;padding:5px 14px;font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--gy);transition:all .2s}
.mchip.on{background:var(--bk);border-color:var(--bk);color:var(--wh)}
.mtog{width:100%;padding:11px;border:1px solid #ddd;border-radius:4px;background:none;cursor:pointer;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gy);transition:all .2s;margin-top:16px}
.mtog.on{background:var(--lk);border-color:var(--lk);color:var(--wh)}
.mstat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f5f5f5}
.mstat:last-child{border:none}
.mstn{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gy)}
.mstv{font-family:'EB Garamond',serif;font-size:18px}
main{padding-top:92px}
/* TENDENCIAS */
.t-day-hdr{padding:44px 20px 10px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.t-date{font-family:'EB Garamond',serif;font-size:26px}
.t-brands{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gy)}
.t-new{font-size:7px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--wh);background:var(--bk);padding:3px 9px;border-radius:2px;margin-left:auto}
.t-sum{padding:0 20px 22px;font-family:'EB Garamond',serif;font-size:15px;color:#999;line-height:1.7;max-width:540px;font-style:italic}
.t-duo{display:grid;grid-template-columns:1fr 1fr;gap:2px;height:100vh;min-height:480px;max-height:920px}
.t-solo{height:88vh;min-height:440px;max-height:820px}
.t-sep{height:1px;background:#ebebeb;margin:40px 0 0}
.edc{position:relative;overflow:hidden;cursor:pointer;background:var(--lt);height:100%}
.edc img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.25,.46,.45,.94)}
.edc:hover img{transform:scale(1.03)}
.eclabel{position:absolute;bottom:0;left:0;right:0;padding:50px 18px 18px;background:linear-gradient(to top,rgba(0,0,0,.55),transparent)}
.eclabel-cat{font-size:7px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.6);display:block}
.eclabel-name{font-family:'EB Garamond',serif;font-size:18px;color:var(--wh);display:block}
.eclabel-marca{font-size:7px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4);display:block}
.eurg{position:absolute;top:12px;left:12px;font-size:7px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:3px 9px;border-radius:2px;background:rgba(255,255,255,.9);color:var(--bk)}
.eurg.alta{background:var(--bk);color:var(--wh)}
.card-fb{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:5px;opacity:0;transition:opacity .2s}
.edc:hover .card-fb,.edc.liked .card-fb,.edc.disliked .card-fb{opacity:1}
.fb-btn{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;font-size:14px;background:rgba(255,255,255,.9);transition:transform .15s;backdrop-filter:blur(4px)}
.fb-btn:active{transform:scale(.85)}
.fb-btn.la{background:var(--lk);color:white}
.fb-btn.da{background:#333;color:white}
.edc.liked{outline:2px solid var(--lk)}
.edc.disliked{opacity:.3;filter:grayscale(.7)}
.card-acts{position:absolute;bottom:72px;left:18px;display:flex;gap:7px;opacity:0;transition:opacity .2s}
.edc:hover .card-acts{opacity:1}
.act-btn{background:rgba(255,255,255,.92);border:none;border-radius:2px;padding:7px 14px;font-size:8px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;color:var(--bk);text-decoration:none;white-space:nowrap}
.act-btn.dl{background:var(--bk);color:var(--wh)}
/* ESTAMPADOS */
#est-board{display:none}
.est-toolbar{padding:20px 20px 4px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #f0f0f0;margin-bottom:24px}
.etbtn{background:none;border:1px solid #e0e0e0;border-radius:20px;padding:6px 16px;font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:#aaa;transition:all .2s}
.etbtn.on{background:var(--bk);border-color:var(--bk);color:var(--wh)}
.est-grid{padding:0 20px 60px;columns:3 260px;column-gap:12px}
@media(max-width:900px){.est-grid{columns:2 200px}}
@media(max-width:500px){.est-grid{columns:2 140px}}
.ecard{break-inside:avoid;margin-bottom:12px;border:1px solid #f0f0f0;border-radius:4px;overflow:hidden;position:relative;cursor:pointer;transition:box-shadow .25s,transform .25s}
.ecard:hover{box-shadow:0 6px 24px rgba(0,0,0,.1);transform:translateY(-2px)}
.ecard.liked{border-color:var(--lk);box-shadow:0 0 0 2px var(--lk)}
.ecard.disliked{opacity:.25;filter:grayscale(.7)}
.ecard img{width:100%;display:block;object-fit:cover;min-height:180px;max-height:400px;background:var(--lt)}
.ecfb{position:absolute;top:10px;right:10px;display:flex;gap:5px;opacity:0;transition:opacity .2s}
.ecard:hover .ecfb,.ecard.liked .ecfb,.ecard.disliked .ecfb{opacity:1}
.ecfp{width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;font-size:13px;background:rgba(255,255,255,.92);transition:transform .15s}
.ecfp:active{transform:scale(.85)}
.ecfp.la{background:var(--lk);color:white}
.ecfp.da{background:#333;color:white}
.ecatbadge{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92);font-size:7px;font-weight:700;letter-spacing:2px;padding:3px 9px;border-radius:20px;text-transform:uppercase}
.ecbody{padding:14px 14px 16px}
.eccode{font-size:7px;letter-spacing:2px;color:var(--gy);text-transform:uppercase;margin-bottom:3px}
.ecname{font-family:'EB Garamond',serif;font-size:18px;line-height:1.2;margin-bottom:4px}
.ectags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.ectag{font-size:7px;font-weight:600;letter-spacing:1px;padding:2px 8px;border:1px solid #e8e8e8;border-radius:20px;text-transform:uppercase;color:#999}
.ectag.alta{background:#000;color:#fff;border-color:#000}
.ecdesc{font-size:11px;color:#888;line-height:1.6}
.ecref{font-size:9px;color:#bbb;margin-top:6px}
/* MODAL */
.modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:600;align-items:center;justify-content:center;padding:20px}
.modalbg.open{display:flex}
.modal{background:var(--wh);max-width:960px;width:100%;max-height:92vh;display:grid;grid-template-columns:1fr 380px;overflow:hidden;border-radius:2px}
@media(max-width:680px){.modal{grid-template-columns:1fr}}
.mimg{background:var(--lt);position:relative}
.mimg img{width:100%;height:100%;object-fit:cover;display:block;max-height:78vh}
.mclosemod{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.9);border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px}
.mbody{padding:28px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.mcode{font-size:7px;letter-spacing:3px;color:var(--gy);text-transform:uppercase}
.mname{font-family:'EB Garamond',serif;font-size:28px;line-height:1.15}
.mbrand{font-size:9px;letter-spacing:3px;color:var(--gd);text-transform:uppercase}
.mchps{display:flex;gap:7px;flex-wrap:wrap}
.mchp{font-size:8px;letter-spacing:2px;text-transform:uppercase;padding:4px 11px;border:1px solid #ddd;border-radius:2px;color:#666}
.mdesc{font-family:'EB Garamond',serif;font-size:16px;color:#555;line-height:1.8}
.msrc{font-size:10px;color:var(--gy)}
.msrc a{color:var(--bk)}
.mfbrow{display:flex;gap:8px}
.mfbbtn{flex:1;padding:10px;border:1px solid #ddd;border-radius:2px;cursor:pointer;font-size:11px;background:none;transition:all .2s}
.mfbbtn.lon{background:var(--lk);border-color:var(--lk);color:var(--wh)}
.mfbbtn.don{background:#333;border-color:#333;color:var(--wh)}
.macts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.mabtn{padding:11px 20px;font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;border:1px solid #ddd;border-radius:2px;cursor:pointer;text-decoration:none;color:var(--bk);background:none}
.mabtn.pr{background:var(--bk);color:var(--wh);border-color:var(--bk)}
.nores{padding:80px;text-align:center;font-family:'EB Garamond',serif;font-size:20px;color:#ccc;font-style:italic}
footer{padding:32px 20px;border-top:1px solid #f0f0f0;display:flex;justify-content:space-between;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#bbb;margin-top:60px}
@media(max-width:768px){.t-duo{grid-template-columns:1fr;height:auto}.t-duo .edc{height:65vh}.t-solo{height:70vh}}
</style>
</head>

  var eDis=0;Object.keys(efb).forEach(function(k){if(efb[k]==="dislike")eDis++});
  var es=document.getElementById("e-stats");
  if(es)es.innerHTML="<div class=\"mstat\"><span class=\"mstn\">Total</span><span class=\"mstv\">"+ESTAMPADOS.length+"</span></div>"+
    "<div class=\"mstat\"><span class=\"mstn\">Me gusta</span><span class=\"mstv\" style=\"color:var(--lk)\">"+eLk+"</span></div>"+
    "<div class=\"mstat\"><span class=\"mstn\">No gusta</span><span class=\"mstv\" style=\"color:#aaa\">"+eDis+"</span></div>"+
    topE.slice(0,3).map(function(c){return "<div class=\"mstat\"><span class=\"mstn\">"+c+"</span><span class=\"mstv\" style=\"font-size:14px\">"+ecls[c]+"</span></div>"}).join("");
}
function openMod(id,type){
  openId=id;openType=type;
  var item,img,code,name,brand,chips,desc,src,dl;
  if(type==="tend"){
    item=null;
    for(var i=0;i<DAYS.length;i++){for(var j=0;j<DAYS[i].fotos.length;j++){if(DAYS[i].fotos[j].codigo===id){item=DAYS[i].fotos[j];break}}if(item)break}
    if(!item)return;
    img=item.imagen;code=item.codigo;name=item.nombre;brand=item.marca;dl=item.imagen;
    chips="<span class=\"mchp\">"+item.categoria+"</span><span class=\"mchp\">"+item.urgencia+"</span>";
    desc=item.descripcion;src=item.fuente;
    document.getElementById("m-src-p").style.display="block";
    document.getElementById("m-src-a").textContent=src.replace("https://","");
    document.getElementById("m-src-a").href=src;
    document.getElementById("m-src-btn").href=src;
    document.getElementById("m-src-btn").style.display="inline-block";
  }else{
    item=null;for(var k=0;k<ESTAMPADOS.length;k++){if(ESTAMPADOS[k].c===id){item=ESTAMPADOS[k];break}}
    if(!item)return;
    img=item.img;code=item.c;name=item.n;brand="Ref: "+item.ref;dl=item.img;
    chips="<span class=\"mchp\">"+item.cat+"</span><span class=\"mchp\">"+item.urg+"</span><span class=\"mchp\">"+item.tec+"</span>";
    desc=item.desc;
    document.getElementById("m-src-p").style.display="none";
    document.getElementById("m-src-btn").style.display="none";
  }
  document.getElementById("m-img").src=img;
  document.getElementById("m-code").textContent=code;
  document.getElementById("m-name").textContent=name;
  document.getElementById("m-brand").textContent=brand;
  document.getElementById("m-chips").innerHTML=chips;
  document.getElementById("m-desc").textContent=desc;
  document.getElementById("m-dl").href=dl;
  refreshMFb();
  document.getElementById("modalbg").classList.add("open");
}
function refreshMFb(){
  var fb=lFB(openType==="tend"?FB:EFB),v=fb[openId]||"";
  document.getElementById("mfb-like").className="mfbbtn"+(v==="like"?" lon":"");
  document.getElementById("mfb-dis").className="mfbbtn"+(v==="dislike"?" don":"");
}
function closeMod(){document.getElementById("modalbg").classList.remove("open");openId=null}
function openMenu(){document.getElementById("smenu").classList.add("open");document.getElementById("overlay").classList.add("open")}
function closeMenu(){document.getElementById("smenu").classList.remove("open");document.getElementById("overlay").classList.remove("open")}
document.getElementById("menu-btn").addEventListener("click",openMenu);
document.getElementById("menu-close").addEventListener("click",closeMenu);
document.getElementById("overlay").addEventListener("click",closeMenu);
document.getElementById("mod-close").addEventListener("click",closeMod);
document.getElementById("modalbg").addEventListener("click",function(e){if(e.target===this)closeMod()});
document.getElementById("mfb-like").addEventListener("click",function(){setFB(openId,"like",openType==="tend"?FB:EFB);refreshMFb()});
document.getElementById("mfb-dis").addEventListener("click",function(){setFB(openId,"dislike",openType==="tend"?FB:EFB);refreshMFb()});
document.querySelectorAll(".mbtn").forEach(function(b){b.addEventListener("click",function(){
  mode=b.dataset.mode;
  document.querySelectorAll(".mbtn").forEach(function(x){x.classList.remove("on")});b.classList.add("on");
  document.getElementById("tend-board").style.display=mode==="tendencias"?"block":"none";
  document.getElementById("est-board").style.display=mode==="estampados"?"block":"none";
  document.getElementById("t-menu-wrap").style.display=mode==="tendencias"?"block":"none";
  document.getElementById("e-menu-wrap").style.display=mode==="estampados"?"block":"none";
  render();updateUI();
})});
document.querySelectorAll("[data-tcat]").forEach(function(b){b.addEventListener("click",function(){
  document.querySelectorAll("[data-tcat]").forEach(function(x){x.classList.remove("on")});b.classList.add("on");
  tCat=b.dataset.tcat;render();closeMenu();
})});
document.querySelectorAll("[data-turg]").forEach(function(b){b.addEventListener("click",function(){
  document.querySelectorAll("[data-turg]").forEach(function(x){x.classList.remove("on")});b.classList.add("on");tUrg=b.dataset.turg;render();
})});
document.getElementById("t-likes-tog").addEventListener("click",function(){tLikes=!tLikes;this.classList.toggle("on",tLikes);render()});
document.querySelectorAll("[data-ecat]").forEach(function(b){b.addEventListener("click",function(){
  document.querySelectorAll("[data-ecat]").forEach(function(x){x.classList.remove("on")});b.classList.add("on");
  eCat=b.dataset.ecat;
  document.querySelectorAll(".etbtn").forEach(function(x){x.classList.toggle("on",x.dataset.ec===eCat)});
  render();closeMenu();
})});
document.querySelectorAll("[data-eurg]").forEach(function(b){b.addEventListener("click",function(){
  document.querySelectorAll("[data-eurg]").forEach(function(x){x.classList.remove("on")});b.classList.add("on");eUrg=b.dataset.eurg;render();
})});
document.getElementById("e-likes-tog").addEventListener("click",function(){eLikes=!eLikes;this.classList.toggle("on",eLikes);render()});
document.querySelectorAll(".etbtn").forEach(function(b){b.addEventListener("click",function(){
  document.querySelectorAll(".etbtn").forEach(function(x){x.classList.remove("on")});b.classList.add("on");
  eCat=b.dataset.ec;
  document.querySelectorAll("[data-ecat]").forEach(function(x){x.classList.toggle("on",x.dataset.ecat===eCat)});
  render();
})});
document.addEventListener("click",function(e){
  var fb_btn=e.target.closest("[data-val]");
  if(fb_btn){e.stopPropagation();setFB(fb_btn.dataset.id,fb_btn.dataset.val,fb_btn.dataset.type==="tend"?FB:EFB);return}
  var open_btn=e.target.closest("[data-open]");
  if(open_btn){openMod(open_btn.dataset.id,open_btn.dataset.type);return}
  var card=e.target.closest(".edc,.ecard");
  if(card&&!e.target.closest("[data-val],[data-open],a")){openMod(card.dataset.id,card.dataset.type)}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeMod();closeMenu()}});
render();updateUI();
</script>
</body>
</html>
