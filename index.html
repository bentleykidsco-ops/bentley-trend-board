<head>

<title>Bentley Kids · Trend Board</title>

<style>
:root{--black:#000;--white:#fff;--gray:#888;--light:#f5f5f3;--gold:#b8924a;--like:#c0392b}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--white);color:var(--black);overflow-x:hidden}
.site-header{position:fixed;top:0;left:0;right:0;z-index:500;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px)}
.hamburger{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:4px}
.hamburger span{display:block;width:22px;height:1px;background:var(--black);transition:all .3s}
.site-logo{font-family:'EB Garamond',serif;font-size:15px;font-weight:400;letter-spacing:6px;text-transform:uppercase;color:var(--black);text-decoration:none;position:absolute;left:50%;transform:translateX(-50%)}
.site-logo em{font-style:italic;color:var(--gold)}
.header-right{display:flex;align-items:center;gap:16px}
.header-right span{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gray)}
.likes-count{color:var(--like)!important}
.menu-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .35s}
.menu-overlay.open{opacity:1;pointer-events:all}
.side-menu{position:fixed;top:0;left:-340px;bottom:0;width:320px;background:var(--white);z-index:410;transition:left .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow-y:auto}
.side-menu.open{left:0}
.menu-head{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #f0f0f0}
.menu-head-logo{font-family:'EB Garamond',serif;font-size:13px;letter-spacing:5px;text-transform:uppercase}
.menu-close{background:none;border:none;cursor:pointer;font-size:18px;color:var(--black);line-height:1}
.menu-section{padding:28px 24px 0}
.menu-section-label{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--gray);margin-bottom:14px}
.menu-items{display:flex;flex-direction:column}
.menu-item{background:none;border:none;border-bottom:1px solid #f5f5f5;text-align:left;padding:13px 0;font-family:'EB Garamond',serif;font-size:20px;cursor:pointer;color:var(--black);display:flex;align-items:center;justify-content:space-between;transition:color .2s}
.menu-item:hover{color:var(--gold)}
.menu-item.active{color:var(--gold)}
.menu-item-count{font-family:'Inter',sans-serif;font-size:9px;color:var(--gray);letter-spacing:1px}
.menu-divider{height:1px;background:#f0f0f0;margin:24px 24px 0}
.menu-urgency{padding:20px 24px 0}
.urg-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.urg-chip{background:none;border:1px solid #ddd;border-radius:20px;padding:6px 16px;font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--gray);transition:all .2s;font-family:'Inter',sans-serif}
.urg-chip.active{background:var(--black);border-color:var(--black);color:var(--white)}
.menu-likes-toggle{padding:20px 24px}
.toggle-btn{width:100%;padding:12px;border:1px solid #ddd;border-radius:4px;background:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gray);transition:all .2s;display:flex;align-items:center;gap:8px}
.toggle-btn.on{background:var(--like);border-color:var(--like);color:var(--white)}
.menu-stats{padding:0 24px 32px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5}
.stat-row:last-child{border:none}
.stat-name{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gray)}
.stat-val{font-family:'EB Garamond',serif;font-size:18px}
.main{padding-top:52px}
.day-header{padding:48px 20px 12px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.day-date{font-family:'EB Garamond',serif;font-size:28px;font-weight:400}
.day-brands{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gray)}
.day-new{font-size:8px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--white);background:var(--black);padding:3px 10px;border-radius:2px;margin-left:auto}
.day-summary{padding:0 20px 24px;font-family:'EB Garamond',serif;font-size:16px;color:#999;line-height:1.7;max-width:560px;font-style:italic}
.editorial-block{width:100%}
.block-duo{display:grid;grid-template-columns:1fr 1fr;gap:2px;height:100vh;min-height:480px;max-height:920px}
.block-solo{height:88vh;min-height:440px;max-height:820px}
.ed-card{position:relative;overflow:hidden;cursor:pointer;background:var(--light)}
.ed-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.25,.46,.45,.94)}
.ed-card:hover img{transform:scale(1.03)}
.card-label{position:absolute;bottom:0;left:0;right:0;padding:50px 20px 20px;background:linear-gradient(to top,rgba(0,0,0,.55) 0%,transparent 100%);display:flex;flex-direction:column;gap:3px}
.card-label-cat{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.65)}
.card-label-name{font-family:'EB Garamond',serif;font-size:19px;color:var(--white);line-height:1.2}
.card-label-marca{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.45)}
.card-urgency{position:absolute;top:14px;left:14px;font-size:7px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;border-radius:2px;background:rgba(255,255,255,.9);color:var(--black)}
.card-urgency.alta{background:var(--black);color:var(--white)}
.card-fb{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;opacity:0;transition:opacity .2s}
.ed-card:hover .card-fb,.ed-card.liked .card-fb,.ed-card.disliked .card-fb{opacity:1}
.fb-pill{width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.9);transition:transform .15s,background .15s;backdrop-filter:blur(4px)}
.fb-pill:active{transform:scale(.85)}
.fb-pill.like-active{background:var(--like)}
.fb-pill.dis-active{background:#333}
.ed-card.liked{outline:2px solid var(--like)}
.ed-card.disliked{opacity:.3;filter:grayscale(.7)}
.ed-card.disliked:hover{opacity:.5}
.card-overlay{position:absolute;inset:0;opacity:0;transition:opacity .3s;pointer-events:none}
.ed-card:hover .card-overlay{opacity:1}
.overlay-actions{position:absolute;bottom:74px;left:20px;display:flex;gap:8px;pointer-events:all}
.ov-pill{background:rgba(255,255,255,.92);border:none;border-radius:2px;padding:8px 16px;font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;color:var(--black);text-decoration:none;transition:background .2s;backdrop-filter:blur(4px);white-space:nowrap}
.ov-pill:hover{background:var(--white)}
.ov-pill.dl{background:var(--black);color:var(--white)}
.ov-pill.dl:hover{background:#222}
.day-sep{height:1px;background:#ebebeb;margin:40px 0 0}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:600;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--white);max-width:980px;width:100%;max-height:92vh;display:grid;grid-template-columns:1fr 400px;overflow:hidden;border-radius:2px}
@media(max-width:700px){.modal{grid-template-columns:1fr}}
.modal-img{background:var(--light);position:relative;overflow:hidden}
.modal-img img{width:100%;height:100%;object-fit:cover;display:block;max-height:80vh}
.modal-body{padding:32px 28px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.modal-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.9);border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;color:var(--black);display:flex;align-items:center;justify-content:center}
.modal-code{font-size:8px;letter-spacing:3px;color:var(--gray);text-transform:uppercase}
.modal-name{font-family:'EB Garamond',serif;font-size:30px;line-height:1.15;font-weight:400}
.modal-brand{font-size:9px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
.modal-chips{display:flex;gap:8px;flex-wrap:wrap}
.modal-chip{font-size:8px;letter-spacing:2px;text-transform:uppercase;padding:4px 12px;border:1px solid #ddd;border-radius:2px;color:#666}
.modal-desc{font-family:'EB Garamond',serif;font-size:17px;color:#555;line-height:1.8}
.modal-source{font-size:10px;color:var(--gray)}

.modal-fb-row{display:flex;gap:10px}
.modal-fb-btn{flex:1;padding:11px;border:1px solid #ddd;border-radius:2px;cursor:pointer;font-size:11px;background:none;transition:all .2s}
.modal-fb-btn.like-on{background:var(--like);border-color:var(--like);color:var(--white)}
.modal-fb-btn.dis-on{background:#333;border-color:#333;color:var(--white)}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.modal-btn{padding:12px 22px;font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;border:1px solid #ddd;border-radius:2px;cursor:pointer;text-decoration:none;color:var(--black);background:none;transition:all .2s}
.modal-btn:hover{border-color:var(--black)}
.modal-btn.primary{background:var(--black);color:var(--white);border-color:var(--black)}
.no-results{padding:100px 20px;text-align:center;font-family:'EB Garamond',serif;font-size:22px;color:#ccc;font-style:italic}
footer{padding:36px 20px;border-top:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#bbb;margin-top:60px}

</head>

const FB_KEY='bk_fb_v2';
const loadFB=()=>{try{return JSON.parse(localStorage.getItem(FB_KEY)||'{}')}catch{return{}}};
const saveFB=fb=>localStorage.setItem(FB_KEY,JSON.stringify(fb));
function setFB(c,v){const fb=loadFB();fb[c]===v?delete fb[c]:(fb[c]=v);saveFB(fb);render();updateCounts();}
let activeCat='all',activeUrg='all',onlyLikes=false,openId=null;
function filtered(){const fb=loadFB();return DAYS.map(d=>({...d,fotos:d.fotos.filter(f=>{if(activeCat!=='all'&&f.categoria!==activeCat)return false;if(activeUrg!=='all'&&f.urgencia!==activeUrg)return false;if(onlyLikes&&fb[f.codigo]!=='like')return false;return true;})})).filter(d=>d.fotos.length>0);}
const isToday=d=>d===new Date().toISOString().slice(0,10);
function cardHTML(f,fb){const v=fb[f.codigo];const lc=v==='like'?'liked':v==='dislike'?'disliked':'';const uc=f.urgencia==='Alta'?'alta':'media';return `<div class="ed-card ${lc}" id="edc-${f.codigo}" onclick="openMod('${f.codigo}')"><img src="${f.imagen}" alt="${f.nombre}" loading="lazy"><span class="card-urgency ${uc}">${f.urgencia}</span><div class="card-fb"><button class="fb-pill ${v==='like'?'like-active':''}" onclick="event.stopPropagation();setFB('${f.codigo}','like')">&#x2764;</button><button class="fb-pill ${v==='dislike'?'dis-active':''}" onclick="event.stopPropagation();setFB('${f.codigo}','dislike')">&#x1F44E;</button></div><div class="card-overlay"><div class="overlay-actions"><a class="ov-pill dl" href="${f.imagen}" download="${f.codigo}.jpg" target="_blank" onclick="event.stopPropagation()">Descargar</a><button class="ov-pill" onclick="event.stopPropagation();openMod('${f.codigo}')">Detalle</button></div></div><div class="card-label"><span class="card-label-cat">${f.categoria}</span><span class="card-label-name">${f.nombre}</span><span class="card-label-marca">${f.marca}</span></div></div>`;}
function render(){const fb=loadFB();const days=filtered();const board=document.getElementById('main-board');if(!days.length){board.innerHTML='<div class="no-results">Sin referencias para este filtro.</div>';return;}let html='';days.forEach((day,di)=>{const fotos=day.fotos;const today=isToday(day.fecha)&&di===0;html+=`<div class="day-header"><span class="day-date">${day.label}</span><span class="day-brands">${day.marcas.join(' &middot; ')}</span>${today?'<span class="day-new">Hoy</span>':''}</div><div class="day-summary">${day.resumen}</div>`;let i=0,bi=0;while(i<fotos.length){if(bi%3===2){html+=`<div class="editorial-block block-solo">${cardHTML(fotos[i],fb)}</div>`;i+=1;}else if(i+1<fotos.length){html+=`<div class="editorial-block block-duo">${cardHTML(fotos[i],fb)}${cardHTML(fotos[i+1],fb)}</div>`;i+=2;}else{html+=`<div class="editorial-block block-solo">${cardHTML(fotos[i],fb)}</div>`;i+=1;}bi++;}if(di<days.length-1)html+='<div class="day-sep"></div>';});board.innerHTML=html;updateCounts();}
function updateCounts(){const fb=loadFB();const all=DAYS.flatMap(d=>d.fotos);const likes=Object.values(fb).filter(v=>v==='like').length;const dislikes=Object.values(fb).filter(v=>v==='dislike').length;document.getElementById('hdr-likes').textContent=likes>0?'❤️ '+likes:'';document.getElementById('hdr-total').textContent=all.length+' ref';document.getElementById('footer-date').textContent=DAYS[0]?.label||'';['all','Chaquetas','Buzos','Camisetas','Conjuntos','Pantalones','Abrigos','Vestidos','Blusas'].forEach(c=>{const el=document.getElementById('cnt-'+c);if(el)el.textContent=c==='all'?all.length:all.filter(f=>f.categoria===c).length;});const cl={};all.forEach(f=>{if(fb[f.codigo]==='like')cl[f.categoria]=(cl[f.categoria]||0)+1;});const top=Object.entries(cl).sort((a,b)=>b[1]-a[1]);document.getElementById('menu-stats-body').innerHTML=`<div class="stat-row"><span class="stat-name">Total</span><span class="stat-val">${all.length}</span></div><div class="stat-row"><span class="stat-name">Me gusta</span><span class="stat-val" style="color:var(--like)">${likes}</span></div><div class="stat-row"><span class="stat-name">No gusta</span><span class="stat-val" style="color:#999">${dislikes}</span></div>${top.slice(0,3).map(([c,n])=>`<div class="stat-row"><span class="stat-name">${c}</span><span class="stat-val" style="font-size:14px">❤️ ${n}</span></div>`).join('')}`;}
function openMod(c){const f=DAYS.flatMap(d=>d.fotos).find(x=>x.codigo===c);if(!f)return;openId=c;document.getElementById('m-img').src=f.imagen;document.getElementById('m-code').textContent=f.codigo;document.getElementById('m-name').textContent=f.nombre;document.getElementById('m-brand').textContent=f.marca;document.getElementById('m-cat').textContent=f.categoria;document.getElementById('m-urg').textContent=f.urgencia+' urgencia';document.getElementById('m-desc').textContent=f.descripcion;document.getElementById('m-src').textContent=f.fuente.replace('https://','');document.getElementById('m-src').href=f.fuente;document.getElementById('m-src-btn').href=f.fuente;document.getElementById('m-dl').href=f.imagen;refreshFB();document.getElementById('modal-bg').classList.add('open');}
function refreshFB(){const v=loadFB()[openId];document.getElementById('mfb-like').className='modal-fb-btn'+(v==='like'?' like-on':'');document.getElementById('mfb-dis').className='modal-fb-btn'+(v==='dislike'?' dis-on':'');}
function modalFb(v){setFB(openId,v);refreshFB();}
function closeMod(){document.getElementById('modal-bg').classList.remove('open');openId=null;}
function openMenu(){document.getElementById('side-menu').classList.add('open');document.getElementById('menu-overlay').classList.add('open');}
function closeMenu(){document.getElementById('side-menu').classList.remove('open');document.getElementById('menu-overlay').classList.remove('open');}
document.getElementById('menu-btn').addEventListener('click',openMenu);
document.querySelectorAll('#cat-menu .menu-item').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#cat-menu .menu-item').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeCat=b.dataset.cat;render();closeMenu();}));
document.querySelectorAll('.urg-chip').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.urg-chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeUrg=b.dataset.u;render();}));
document.getElementById('likes-toggle').addEventListener('click',function(){onlyLikes=!onlyLikes;this.classList.toggle('on',onlyLikes);render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMod();closeMenu();}});
render();
</script>
